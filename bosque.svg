<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo verde -->
  <rect width="64" height="64" fill="#44FF44"/>
  <!-- Cruz/Asterisco de 4 puntas -->
  <!-- Punta arriba -->
  <rect x="24" y="8" width="16" height="16" fill="#00AA00"/>
  <!-- Punta abajo -->
  <rect x="24" y="40" width="16" height="16" fill="#00AA00"/>
  <!-- Punta izquierda -->
  <rect x="8" y="24" width="16" height="16" fill="#00AA00"/>
  <!-- Punta derecha -->
  <rect x="40" y="24" width="16" height="16" fill="#00AA00"/>
  <!-- Centro -->
  <rect x="24" y="24" width="16" height="16" fill="#00FF00"/>
  <!-- Detalles más oscuros -->
  <rect x="28" y="12" width="8" height="8" fill="#008800"/>
  <rect x="28" y="44" width="8" height="8" fill="#008800"/>
  <rect x="12" y="28" width="8" height="8" fill="#008800"/>
  <rect x="44" y="28" width="8" height="8" fill="#008800"/>
</svg>
