<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo naranja -->
  <rect width="100" height="100" fill="#DD9933" stroke="#BB6600" stroke-width="3"/>
  <!-- Montaña pixelada marrón oscura -->
  <!-- Pico principal -->
  <rect x="45" y="15" width="10" height="10" fill="#664422"/>
  <!-- Laderas -->
  <rect x="35" y="25" width="10" height="10" fill="#775533"/>
  <rect x="45" y="25" width="10" height="10" fill="#664422"/>
  <rect x="55" y="25" width="10" height="10" fill="#775533"/>
  <!-- Nivel medio -->
  <rect x="25" y="35" width="10" height="10" fill="#885544"/>
  <rect x="35" y="35" width="10" height="10" fill="#664422"/>
  <rect x="45" y="35" width="10" height="10" fill="#553311"/>
  <rect x="55" y="35" width="10" height="10" fill="#664422"/>
  <rect x="65" y="35" width="10" height="10" fill="#885544"/>
  <!-- Base -->
  <rect x="20" y="45" width="10" height="10" fill="#553311"/>
  <rect x="30" y="45" width="10" height="10" fill="#664422"/>
  <rect x="40" y="45" width="20" height="10" fill="#553311"/>
