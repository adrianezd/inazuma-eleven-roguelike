<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Montaña: Picos triangulares -->
  <defs>
    <linearGradient id="mountainFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6F47;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Montaña principal grande -->
  <polygon points="50,15 85,70 15,70" fill="url(#mountainFill)" stroke="#654321" stroke-width="2"/>
  <!-- Montañas secundarias -->
  <polygon points="35,70 55,35 75,70" fill="#A0826D" opacity="0.7"/>
  <polygon points="25,70 40,45 55,70" fill="#B8956F" opacity="0.6"/>
  <!-- Nieve en picos -->
  <polygon points="50,15 55,30 45,30" fill="#FFF" opacity="0.9"/>
  <polygon points="35,50 40,60 30,60" fill="#E8E8E8" opacity="0.8"/>
</svg>
